<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam Papers - Ethiopian Exam Prep</title>
    <link rel="icon" href="images/logo.jpg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f0f4f8;
        color: #2c3e50;
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ===== NAVIGATION BAR (Same as Dashboard) ===== */
      .header {
        background: linear-gradient(135deg, #0a2540, #003b6f);
        padding: 12px 30px;
        position: fixed;
        width: 100%;
        top: 0;
        z-index: 1000;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        animation: slideDown 0.5s ease-out;
      }
      @keyframes slideDown {
        from {
          transform: translateY(-100%);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      .nav {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .logo-container {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
      }
      .logo-image {
        height: 45px;
        width: 45px;
        border-radius: 50%;
        object-fit: cover;
        transition: all 0.3s ease;
        border: 2px solid rgba(77, 166, 255, 0.3);
      }
      .logo-image:hover {
        transform: scale(1.05);
        box-shadow: 0 0 20px rgba(77, 166, 255, 0.3);
        border-color: #4da6ff;
      }
      .logo {
        color: white;
        font-size: 20px;
        font-weight: 700;
        text-decoration: none;
        letter-spacing: 0.5px;
        transition: all 0.3s ease;
      }
      .logo:hover {
        color: #4da6ff;
      }
      .nav-right {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .user-badge {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(255, 255, 255, 0.1);
        padding: 8px 16px;
        border-radius: 25px;
      }
      .user-avatar {
        width: 35px;
        height: 35px;
        border-radius: 50%;
        background: linear-gradient(135deg, #4da6ff, #66ccff);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 0.9rem;
      }
      .user-name {
        color: white;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .logout-btn {
        background: rgba(255, 82, 82, 0.9);
        color: white;
        border: none;
        padding: 10px 22px;
        border-radius: 25px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9rem;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .logout-btn:hover {
        background: #dc2626;
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(220, 38, 38, 0.4);
      }

      /* ===== MAIN CONTENT ===== */
      .main-content {
        flex: 1;
        margin-top: 70px;
        padding: 40px 20px;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }
      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 30px;
        color: #5a6c7d;
        font-size: 0.9rem;
        flex-wrap: wrap;
      }
      .breadcrumb a {
        color: #4da6ff;
        text-decoration: none;
      }
      .breadcrumb a:hover {
        text-decoration: underline;
      }
      .breadcrumb i {
        font-size: 0.7rem;
        color: #9ca3af;
      }
      .page-title {
        margin-bottom: 30px;
      }
      .page-title h1 {
        font-size: 2rem;
        color: #003b6f;
        margin-bottom: 5px;
      }
      .page-title p {
        color: #5a6c7d;
      }
      .papers-list {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      .paper-card {
        background: white;
        border-radius: 12px;
        padding: 20px 25px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        transition: all 0.3s ease;
        border-left: 4px solid #4da6ff;
      }
      .paper-card:hover {
        transform: translateX(5px);
        box-shadow: 0 8px 25px rgba(77, 166, 255, 0.15);
      }
      .paper-info {
        display: flex;
        align-items: center;
        gap: 20px;
        flex: 1;
      }
      .paper-icon {
        font-size: 2rem;
        color: #4da6ff;
      }
      .paper-details h3 {
        font-size: 1.1rem;
        color: #003b6f;
        margin-bottom: 5px;
      }
      .paper-details p {
        font-size: 0.85rem;
        color: #5a6c7d;
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
      }
      .paper-details p i {
        margin-right: 5px;
      }
      .download-btn {
        background: linear-gradient(135deg, #4da6ff, #66ccff);
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 25px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9rem;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        flex-shrink: 0;
      }
      .download-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(77, 166, 255, 0.4);
      }
      .no-papers {
        text-align: center;
        padding: 60px;
        background: white;
        border-radius: 15px;
      }
      .no-papers i {
        font-size: 4rem;
        color: #4da6ff;
        margin-bottom: 20px;
        display: block;
      }
      .no-papers h3 {
        color: #003b6f;
        margin-bottom: 10px;
      }
      .no-papers p {
        color: #5a6c7d;
      }
      .loading {
        text-align: center;
        padding: 60px;
        color: #5a6c7d;
      }
      .loading i {
        font-size: 2.5rem;
        color: #4da6ff;
        margin-bottom: 15px;
        display: block;
      }

      /* ===== FOOTER ===== */
      .footer {
        background: linear-gradient(135deg, #0a2540, #003b6f);
        color: rgba(255, 255, 255, 0.7);
        text-align: center;
        padding: 25px;
      }
      .footer a {
        color: #4da6ff;
        text-decoration: none;
      }

      /* ===== RESPONSIVE ===== */
      @media (max-width: 768px) {
        .header {
          padding: 10px 15px;
        }
        .logo {
          font-size: 16px;
        }
        .logo-image {
          height: 35px;
          width: 35px;
        }
        .user-name {
          display: none;
        }
        .user-badge {
          padding: 5px 10px;
        }
        .user-avatar {
          width: 30px;
          height: 30px;
          font-size: 0.8rem;
        }
        .logout-btn {
          padding: 8px 15px;
          font-size: 0.8rem;
        }
        .page-title h1 {
          font-size: 1.5rem;
        }
      }
      @media (max-width: 600px) {
        .paper-card {
          flex-direction: column;
          align-items: flex-start;
          gap: 15px;
        }
        .download-btn {
          width: 100%;
          justify-content: center;
        }
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #e6f0ff;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(135deg, #4da6ff, #66ccff);
        border-radius: 4px;
      }
      ::selection {
        background: #4da6ff;
        color: white;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <nav class="nav">
        <a href="/dashboard" class="logo-container">
          <img src="images/logo.jpg" alt="Logo" class="logo-image" />
          <span class="logo">Ethiopian Exam Prep</span>
        </a>
        <div class="nav-right">
          <div class="user-badge">
            <div class="user-avatar" id="userAvatar">S</div>
            <span class="user-name" id="userName">Student</span>
          </div>
          <button class="logout-btn" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </nav>
    </header>

    <main class="main-content">
      <div class="container">
        <div class="breadcrumb">
          <a href="/dashboard">Dashboard</a>
          <i class="fas fa-chevron-right"></i>
          <a href="#" id="backLink">Subjects</a>
          <i class="fas fa-chevron-right"></i>
          <span id="subjectName">Papers</span>
        </div>
        <div class="page-title">
          <h1 id="pageTitle">Exam Papers</h1>
          <p id="pageSubtitle">Download past exam papers</p>
        </div>
        <div class="papers-list" id="papersList">
          <div class="loading">
            <i class="fas fa-spinner fa-spin"></i>Loading papers...
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>© 2026 <a href="/">Ethiopian Exam Prep</a> · Free for all students</p>
    </footer>

    <script>
      const token = localStorage.getItem("token");
      const user = JSON.parse(localStorage.getItem("user") || "{}");
      if (!token) {
        window.location.replace("/login");
      }
      const fullName = user.fullName || user.full_name || "Student";
      document.getElementById("userName").textContent = fullName;
      document.getElementById("userAvatar").textContent = fullName
        .charAt(0)
        .toUpperCase();

      const urlParams = new URLSearchParams(window.location.search);
      const examSlug = urlParams.get("exam") || "";
      const subjectSlug = urlParams.get("subject") || "";
      const streamSlug = urlParams.get("stream") || "";

      document.getElementById("backLink").href =
        `/subjects.html?exam=${examSlug}${streamSlug ? "&stream=" + streamSlug : ""}`;

      async function loadPapers() {
        const list = document.getElementById("papersList");
        try {
          const response = await fetch(`/api/papers/${subjectSlug}`);
          const papers = await response.json();
          if (papers.length === 0) {
            list.innerHTML =
              '<div class="no-papers"><i class="fas fa-folder-open"></i><h3>No Papers Available Yet</h3><p>Papers for this subject will be uploaded soon. Check back later!</p></div>';
            return;
          }
          document.getElementById("subjectName").textContent =
            papers[0].subject_name;
          document.getElementById("pageTitle").textContent =
            `${papers[0].subject_name} - Exam Papers`;
          document.getElementById("pageSubtitle").textContent =
            `${papers.length} papers available for download`;
          list.innerHTML = papers
            .map(
              (paper) => `
          <div class="paper-card">
            <div class="paper-info">
              <span class="paper-icon"><i class="fas fa-file-pdf"></i></span>
              <div class="paper-details">
                <h3>${paper.title || paper.subject_name + " " + paper.year}</h3>
                <p><span><i class="fas fa-calendar"></i> Year: ${paper.year}</span><span><i class="fas fa-hdd"></i> ${paper.file_size || "Unknown"}</span><span><i class="fas fa-download"></i> ${paper.download_count || 0}</span></p>
              </div>
            </div>
            <button class="download-btn" onclick="downloadPaper(${paper.id}, '${paper.file_path}')"><i class="fas fa-download"></i> Download</button>
          </div>
        `,
            )
            .join("");
        } catch (error) {
          list.innerHTML =
            '<div class="loading"><i class="fas fa-exclamation-circle"></i>Error loading papers.</div>';
        }
      }

      async function downloadPaper(paperId, filePath) {
        try {
          await fetch(`/api/papers/${paperId}/download`, { method: "POST" });
          const link = document.createElement("a");
          link.href = filePath;
          link.download = filePath.split("/").pop();
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(() => loadPapers(), 1000);
        } catch (error) {
          alert("Download failed. Please try again.");
        }
      }

      function logout() {
        localStorage.clear();
        sessionStorage.clear();
        document.cookie.split(";").forEach((c) => {
          document.cookie = c
            .replace(/^ +/, "")
            .replace(
              /=.*/,
              "=;expires=" + new Date().toUTCString() + ";path=/",
            );
        });
        window.location.replace("/login");
      }
      window.addEventListener("pageshow", function (e) {
        if (e.persisted && !localStorage.getItem("token")) {
          window.location.replace("/login");
        }
      });

      loadPapers();
    </script>
  </body>
</html>
