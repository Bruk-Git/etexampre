<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Ethiopian Exam Prep</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body>
    <header class="header">
      <nav class="nav container">
        <a href="/" class="logo">📚 ExamPrep</a>
        <div class="nav-links">
          <a href="/dashboard">Dashboard</a>
          <a href="/exams">Exams</a>
          <span id="userName" class="user-name"></span>
          <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
      </nav>
    </header>

    <main class="dashboard container">
      <!-- Welcome Section -->
      <section class="welcome-section">
        <h1>Welcome back, <span id="userFullName">Student</span>!</h1>
        <p>Continue your exam preparation journey</p>
      </section>

      <!-- Quick Stats -->
      <section class="stats-section">
        <div class="stat-card">
          <span class="stat-icon">📄</span>
          <div class="stat-info">
            <span class="stat-value" id="papersDownloaded">0</span>
            <span class="stat-label">Papers Downloaded</span>
          </div>
        </div>
        <div class="stat-card">
          <span class="stat-icon">✍️</span>
          <div class="stat-info">
            <span class="stat-value" id="quizzesTaken">0</span>
            <span class="stat-label">Quizzes Taken</span>
          </div>
        </div>
        <div class="stat-card">
          <span class="stat-icon">⭐</span>
          <div class="stat-info">
            <span class="stat-value" id="avgScore">0%</span>
            <span class="stat-label">Average Score</span>
          </div>
        </div>
      </section>

      <!-- Available Exams -->
      <section class="exams-section">
        <h2>Available Exams</h2>
        <div class="exams-grid" id="dashboardExams">
          <div class="loading">Loading exams...</div>
        </div>
      </section>

      <!-- Recent Activity -->
      <section class="activity-section">
        <h2>Recent Activity</h2>
        <div class="activity-list" id="recentActivity">
          <p class="no-activity">
            No recent activity. Start by downloading your first exam paper!
          </p>
        </div>
      </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
