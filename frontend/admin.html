<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - Ethiopian Exam Prep</title>
    <link rel="icon" href="images/logo.jpg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f0f4f8;
        color: #2c3e50;
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .header {
        background: linear-gradient(135deg, #0a2540, #003b6f);
        padding: 12px 30px;
        position: fixed;
        width: 100%;
        top: 0;
        z-index: 1000;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }
      .nav {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .logo-container {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
      }
      .logo-image {
        height: 45px;
        width: 45px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid rgba(77, 166, 255, 0.3);
      }
      .logo {
        color: white;
        font-size: 20px;
        font-weight: 700;
        text-decoration: none;
      }
      .nav-right {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .user-badge {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(255, 255, 255, 0.1);
        padding: 8px 16px;
        border-radius: 25px;
      }
      .user-avatar {
        width: 35px;
        height: 35px;
        border-radius: 50%;
        background: linear-gradient(135deg, #ff9800, #ff5722);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 0.9rem;
      }
      .user-name {
        color: white;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .logout-btn {
        background: rgba(255, 82, 82, 0.9);
        color: white;
        border: none;
        padding: 10px 22px;
        border-radius: 25px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9rem;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .logout-btn:hover {
        background: #dc2626;
        transform: translateY(-2px);
      }

      .main-content {
        flex: 1;
        margin-top: 70px;
        padding: 40px 20px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
        flex-wrap: wrap;
      }
      .tab-btn {
        padding: 12px 25px;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9rem;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        gap: 8px;
        background: white;
        color: #5a6c7d;
      }
      .tab-btn.active {
        background: linear-gradient(135deg, #4da6ff, #66ccff);
        color: white;
        box-shadow: 0 4px 15px rgba(77, 166, 255, 0.3);
      }
      .tab-btn:hover:not(.active) {
        background: #e6f0ff;
        color: #4da6ff;
      }

      .tab-content {
        display: none;
      }
      .tab-content.active {
        display: block;
        animation: fadeIn 0.4s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }
      .stat-card {
        background: white;
        border-radius: 15px;
        padding: 20px;
        display: flex;
        align-items: center;
        gap: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      }
      .stat-icon {
        width: 50px;
        height: 50px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        flex-shrink: 0;
      }
      .stat-icon.blue {
        background: #e6f0ff;
        color: #4da6ff;
      }
      .stat-icon.green {
        background: #e6ffe6;
        color: #28a745;
      }
      .stat-icon.orange {
        background: #fff3e6;
        color: #ff9800;
      }
      .stat-info h3 {
        font-size: 1.5rem;
        color: #003b6f;
      }
      .stat-info p {
        font-size: 0.85rem;
        color: #5a6c7d;
      }

      .upload-form {
        background: white;
        border-radius: 15px;
        padding: 30px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        max-width: 700px;
      }
      .upload-form h2 {
        margin-bottom: 25px;
        color: #003b6f;
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }
      .form-group {
        margin-bottom: 18px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        color: #374151;
        font-size: 0.85rem;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 11px 14px;
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        font-size: 0.95rem;
        transition: all 0.3s;
        background: #f9fafb;
      }
      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: #4da6ff;
        box-shadow: 0 0 0 3px rgba(77, 166, 255, 0.1);
        background: white;
      }
      .file-upload {
        border: 2px dashed #e5e7eb;
        border-radius: 10px;
        padding: 30px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s;
      }
      .file-upload:hover {
        border-color: #4da6ff;
        background: #f0f4f8;
      }
      .file-upload i {
        font-size: 2rem;
        color: #4da6ff;
        margin-bottom: 10px;
        display: block;
      }
      .file-upload p {
        color: #5a6c7d;
        font-size: 0.9rem;
      }

      .submit-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #4da6ff, #66ccff);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s;
      }
      .submit-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(77, 166, 255, 0.4);
      }
      .submit-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .papers-table {
        background: white;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }
      .table-header {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
        padding: 15px 20px;
        background: #f0f4f8;
        font-weight: 700;
        color: #003b6f;
        font-size: 0.85rem;
      }
      .table-row {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
        padding: 15px 20px;
        border-bottom: 1px solid #e6f0ff;
        align-items: center;
        font-size: 0.85rem;
      }
      .table-row:hover {
        background: #f0f4f8;
      }
      .delete-btn {
        background: #fee2e2;
        color: #dc2626;
        border: none;
        padding: 8px 15px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.8rem;
        transition: all 0.3s;
      }
      .delete-btn:hover {
        background: #dc2626;
        color: white;
      }

      .alert {
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        display: none;
        font-weight: 500;
      }
      .alert-success {
        background: #d1fae5;
        color: #065f46;
        border: 1px solid #a7f3d0;
        display: block;
      }
      .alert-error {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fecaca;
        display: block;
      }

      .footer {
        background: linear-gradient(135deg, #0a2540, #003b6f);
        color: rgba(255, 255, 255, 0.7);
        text-align: center;
        padding: 25px;
      }
      .footer a {
        color: #4da6ff;
        text-decoration: none;
      }

      @media (max-width: 768px) {
        .header {
          padding: 10px 15px;
        }
        .logo {
          font-size: 16px;
        }
        .logo-image {
          height: 35px;
          width: 35px;
        }
        .user-name {
          display: none;
        }
        .form-row {
          grid-template-columns: 1fr;
        }
        .table-header {
          grid-template-columns: 1fr 0.7fr 0.7fr;
        }
        .table-row {
          grid-template-columns: 1fr 0.7fr 0.7fr;
        }
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #e6f0ff;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(135deg, #4da6ff, #66ccff);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <nav class="nav">
        <a href="/dashboard" class="logo-container">
          <img src="images/logo.jpg" alt="Logo" class="logo-image" />
          <span class="logo">Ethiopian Exam Prep</span>
        </a>
        <div class="nav-right">
          <div class="user-badge">
            <div class="user-avatar" id="userAvatar">A</div>
            <span class="user-name" id="userName">Admin</span>
          </div>
          <button class="logout-btn" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </nav>
    </header>

    <main class="main-content">
      <div class="container">
        <div class="tabs">
          <button class="tab-btn active" onclick="switchTab('upload')">
            <i class="fas fa-upload"></i> Upload Paper
          </button>
          <button class="tab-btn" onclick="switchTab('manage')">
            <i class="fas fa-list"></i> Manage Papers
          </button>
          <button class="tab-btn" onclick="switchTab('users')">
            <i class="fas fa-users"></i> Users
          </button>
        </div>

        <div id="alertBox" class="alert"></div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon blue"><i class="fas fa-file-pdf"></i></div>
            <div class="stat-info">
              <h3 id="totalPapers">0</h3>
              <p>Total Papers</p>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon green"><i class="fas fa-download"></i></div>
            <div class="stat-info">
              <h3 id="totalDownloads">0</h3>
              <p>Total Downloads</p>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon orange"><i class="fas fa-users"></i></div>
            <div class="stat-info">
              <h3 id="totalUsers">0</h3>
              <p>Registered Users</p>
            </div>
          </div>
        </div>

        <!-- Upload Tab -->
        <div id="uploadTab" class="tab-content active">
          <form
            class="upload-form"
            id="uploadForm"
            enctype="multipart/form-data"
          >
            <h2>
              <i class="fas fa-cloud-upload-alt"></i> Upload New Exam Paper
            </h2>

            <div class="form-row">
              <div class="form-group">
                <label>Exam Type *</label>
                <select id="examType" required onchange="onExamTypeChange()">
                  <option value="">Select Exam Type</option>
                  <option value="grade-12-entrance">Grade 12 Entrance</option>
                  <option value="grade-8">Grade 8 Ministry</option>
                  <option value="grade-6">Grade 6 Ministry</option>
                  <option value="exit-exam">Exit Exam</option>
                  <option value="gat">GAT</option>
                  <option value="ngat">NGAT</option>
                </select>
              </div>
              <div class="form-group">
                <label>Year *</label>
                <input
                  type="number"
                  id="paperYear"
                  placeholder="e.g., 2016"
                  required
                  min="1990"
                  max="2030"
                />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group" id="streamGroup" style="display: none">
                <label>Stream</label>
                <select id="streamSelect" onchange="onStreamChange()">
                  <option value="">Select Stream</option>
                </select>
              </div>
              <div class="form-group" id="regionGroup" style="display: none">
                <label>Region</label>
                <select id="regionSelect" onchange="onRegionChange()">
                  <option value="">Select Region</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label>Subject *</label>
              <select id="subjectSelect" required>
                <option value="">Select Subject</option>
              </select>
            </div>

            <div class="form-group">
              <label>Paper Title</label>
              <input
                type="text"
                id="paperTitle"
                placeholder="e.g., Mathematics Entrance Exam 2016"
              />
            </div>

            <div class="form-group">
              <label>PDF File *</label>
              <div
                class="file-upload"
                onclick="document.getElementById('fileInput').click()"
              >
                <i class="fas fa-file-pdf"></i>
                <p id="fileName">Click to select PDF file</p>
                <input
                  type="file"
                  id="fileInput"
                  accept=".pdf"
                  style="display: none"
                  onchange="fileSelected(this)"
                />
              </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
              <i class="fas fa-upload"></i> Upload Paper
            </button>
          </form>
        </div>

        <!-- Manage Tab -->
        <div id="manageTab" class="tab-content">
          <div class="papers-table">
            <div class="table-header">
              <div>Title</div>
              <div>Year</div>
              <div>Subject</div>
              <div>Downloads</div>
              <div>Action</div>
            </div>
            <div id="papersList">
              <div style="text-align: center; padding: 40px">
                Loading papers...
              </div>
            </div>
          </div>
        </div>

        <!-- Users Tab -->
        <div id="usersTab" class="tab-content">
          <div class="papers-table">
            <div class="table-header">
              <div>Name</div>
              <div>Email</div>
              <div>Grade</div>
              <div>Registered</div>
              <div>Status</div>
            </div>
            <div id="usersList">
              <div style="text-align: center; padding: 40px">
                Loading users...
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>© 2026 <a href="/">Ethiopian Exam Prep</a> · Admin Panel</p>
    </footer>

    <script>
      const token = localStorage.getItem("token");
      const user = JSON.parse(localStorage.getItem("user") || "{}");
      if (!token) {
        window.location.replace("/login");
      }
      document.getElementById("userName").textContent =
        user.fullName || "Admin";
      document.getElementById("userAvatar").textContent = (user.fullName || "A")
        .charAt(0)
        .toUpperCase();

      // ===== TAB SWITCHING =====
      function switchTab(tabName) {
        document
          .querySelectorAll(".tab-content")
          .forEach((el) => el.classList.remove("active"));
        document
          .querySelectorAll(".tab-btn")
          .forEach((el) => el.classList.remove("active"));
        document.getElementById(tabName + "Tab").classList.add("active");
        event.target.classList.add("active");
        if (tabName === "manage") loadPapers();
        if (tabName === "users") loadUsers();
      }

      // ===== FILE SELECTION =====
      function fileSelected(input) {
        if (input.files.length > 0) {
          document.getElementById("fileName").textContent =
            input.files[0].name +
            " (" +
            (input.files[0].size / 1024 / 1024).toFixed(2) +
            " MB)";
        }
      }

      // ===== ON EXAM TYPE CHANGE =====
      // ON EXAM TYPE CHANGE
      async function onExamTypeChange() {
        const examType = document.getElementById("examType").value;
        const streamGroup = document.getElementById("streamGroup");
        const regionGroup = document.getElementById("regionGroup");
        const streamSelect = document.getElementById("streamSelect");
        const regionSelect = document.getElementById("regionSelect");
        const subjectSelect = document.getElementById("subjectSelect");

        // Reset
        streamGroup.style.display = "none";
        regionGroup.style.display = "none";
        streamSelect.innerHTML = '<option value="">Select Stream</option>';
        regionSelect.innerHTML = '<option value="">Select Region</option>';
        subjectSelect.innerHTML = '<option value="">Select Subject</option>';

        if (!examType) return;

        // Check for regions FIRST (Grade 6 and 8)
        if (examType === "grade-6" || examType === "grade-8") {
          try {
            const regionRes = await fetch(`/api/exams/${examType}/regions`);
            const regionData = await regionRes.json();

            if (regionData.hasRegions && regionData.regions.length > 0) {
              regionGroup.style.display = "block";
              regionSelect.innerHTML =
                '<option value="">Select Region</option>' +
                regionData.regions
                  .map((r) => `<option value="${r.slug}">${r.name}</option>`)
                  .join("");
            }
          } catch (e) {
            console.error("Error loading regions:", e);
          }
        }

        // Check for streams (Grade 12)
        if (examType === "grade-12-entrance") {
          try {
            const streamRes = await fetch(`/api/exams/${examType}/streams`);
            const streamData = await streamRes.json();

            if (streamData.hasStreams && streamData.streams.length > 0) {
              streamGroup.style.display = "block";
              streamSelect.innerHTML =
                '<option value="">Select Stream</option>' +
                streamData.streams
                  .map((s) => `<option value="${s.slug}">${s.name}</option>`)
                  .join("");
            }
          } catch (e) {
            console.error("Error loading streams:", e);
          }
        }

        // For GAT, Exit, NGAT - load subjects directly
        if (
          examType === "gat" ||
          examType === "exit-exam" ||
          examType === "ngat"
        ) {
          loadSubjectsForExam(examType);
        }
      }

      // ON REGION CHANGE - Load subjects for that region
      async function onRegionChange() {
        const examType = document.getElementById("examType").value;
        const regionSlug = document.getElementById("regionSelect").value;
        const subjectSelect = document.getElementById("subjectSelect");

        if (!regionSlug) {
          subjectSelect.innerHTML = '<option value="">Select Subject</option>';
          return;
        }

        subjectSelect.innerHTML =
          '<option value="">Loading subjects...</option>';

        try {
          const url = `/api/exams/${examType}/subjects-by-region?regionSlug=${regionSlug}`;
          console.log("Loading subjects from:", url);

          const res = await fetch(url);
          const subjects = await res.json();

          console.log("Subjects for region:", subjects);

          subjectSelect.innerHTML =
            '<option value="">Select Subject</option>' +
            subjects
              .map((s) => `<option value="${s.slug}">${s.name}</option>`)
              .join("");
        } catch (e) {
          console.error("Error loading subjects:", e);
          subjectSelect.innerHTML =
            '<option value="">Error loading subjects</option>';
        }
      }

      // ON STREAM CHANGE
      async function onStreamChange() {
        const examType = document.getElementById("examType").value;
        const streamSlug = document.getElementById("streamSelect").value;
        const subjectSelect = document.getElementById("subjectSelect");

        if (!streamSlug) {
          subjectSelect.innerHTML = '<option value="">Select Subject</option>';
          return;
        }

        loadSubjectsForExam(examType, streamSlug, null);
      }

      // LOAD SUBJECTS HELPER
      async function loadSubjectsForExam(
        examType,
        streamSlug = null,
        regionSlug = null,
      ) {
        const subjectSelect = document.getElementById("subjectSelect");
        subjectSelect.innerHTML =
          '<option value="">Loading subjects...</option>';

        try {
          let url;

          if (regionSlug) {
            url = `/api/exams/${examType}/subjects-by-region?regionSlug=${regionSlug}`;
          } else {
            url = `/api/exams/${examType}/subjects`;
            if (streamSlug) {
              url += `?streamSlug=${streamSlug}`;
            }
          }

          const res = await fetch(url);
          const subjects = await res.json();

          subjectSelect.innerHTML =
            '<option value="">Select Subject</option>' +
            subjects
              .map((s) => `<option value="${s.slug}">${s.name}</option>`)
              .join("");
        } catch (e) {
          subjectSelect.innerHTML =
            '<option value="">Error loading subjects</option>';
        }
      }
      // ===== UPLOAD PAPER =====
      document
        .getElementById("uploadForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const examType = document.getElementById("examType").value;
          const year = document.getElementById("paperYear").value;
          const streamSlug = document.getElementById("streamSelect").value;
          const regionSlug = document.getElementById("regionSelect").value;
          const subjectSlug = document.getElementById("subjectSelect").value;
          const title = document.getElementById("paperTitle").value;
          const file = document.getElementById("fileInput").files[0];

          if (!examType || !year || !subjectSlug || !file) {
            showAlert("Please fill all required fields (*).", "error");
            return;
          }

          const formData = new FormData();
          formData.append("title", title || `${subjectSlug} ${year}`);
          formData.append("year", year);
          formData.append("examTypeSlug", examType);
          formData.append("subjectSlug", subjectSlug);
          if (streamSlug) formData.append("streamSlug", streamSlug);
          if (regionSlug) formData.append("regionSlug", regionSlug);
          formData.append("file", file);

          const submitBtn = document.getElementById("submitBtn");
          submitBtn.disabled = true;
          submitBtn.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Uploading...';

          try {
            const res = await fetch("/api/admin/upload", {
              method: "POST",
              headers: { Authorization: `Bearer ${token}` },
              body: formData,
            });
            const data = await res.json();

            if (res.ok) {
              showAlert("✅ Paper uploaded successfully!", "success");
              document.getElementById("uploadForm").reset();
              document.getElementById("fileName").textContent =
                "Click to select PDF file";
              loadStats();
            } else {
              showAlert(data.error || "Upload failed.", "error");
            }
          } catch (err) {
            showAlert("Upload failed. Please try again.", "error");
          } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-upload"></i> Upload Paper';
          }
        });

      // ===== LOAD PAPERS =====
      async function loadPapers() {
        const list = document.getElementById("papersList");
        try {
          const res = await fetch("/api/admin/papers", {
            headers: { Authorization: `Bearer ${token}` },
          });
          const papers = await res.json();

          if (papers.length === 0) {
            list.innerHTML =
              '<div style="text-align:center;padding:40px;color:#5a6c7d;">No papers uploaded yet.</div>';
            return;
          }

          list.innerHTML = papers
            .map(
              (p) => `
          <div class="table-row">
            <div>${p.title}</div>
            <div>${p.year}</div>
            <div>${p.subject_name}</div>
            <div>${p.download_count || 0}</div>
            <div><button class="delete-btn" onclick="deletePaper(${p.id})"><i class="fas fa-trash"></i> Delete</button></div>
          </div>
        `,
            )
            .join("");
        } catch (e) {
          list.innerHTML =
            '<div style="text-align:center;padding:40px;color:#dc2626;">Error loading papers.</div>';
        }
      }

      // ===== DELETE PAPER =====
      async function deletePaper(id) {
        if (!confirm("Are you sure you want to delete this paper?")) return;
        try {
          const res = await fetch(`/api/admin/papers/${id}`, {
            method: "DELETE",
            headers: { Authorization: `Bearer ${token}` },
          });
          if (res.ok) {
            showAlert("✅ Paper deleted successfully!", "success");
            loadPapers();
            loadStats();
          }
        } catch (e) {
          showAlert("Delete failed.", "error");
        }
      }

      // ===== LOAD USERS =====
      async function loadUsers() {
        const list = document.getElementById("usersList");
        try {
          const res = await fetch("/api/admin/users", {
            headers: { Authorization: `Bearer ${token}` },
          });
          const users = await res.json();

          if (users.length === 0) {
            list.innerHTML =
              '<div style="text-align:center;padding:40px;color:#5a6c7d;">No users registered yet.</div>';
            return;
          }

          list.innerHTML = users
            .map(
              (u) => `
          <div class="table-row">
            <div>${u.full_name}</div>
            <div>${u.email}</div>
            <div>${u.grade || "N/A"}</div>
            <div>${new Date(u.created_at).toLocaleDateString()}</div>
            <div><span style="color:#28a745;">● Active</span></div>
          </div>
        `,
            )
            .join("");
        } catch (e) {
          list.innerHTML =
            '<div style="text-align:center;padding:40px;color:#dc2626;">Error loading users.</div>';
        }
      }

      // ===== LOAD STATS =====
      async function loadStats() {
        try {
          const res = await fetch("/api/admin/stats", {
            headers: { Authorization: `Bearer ${token}` },
          });
          const stats = await res.json();
          document.getElementById("totalPapers").textContent =
            stats.papers || 0;
          document.getElementById("totalDownloads").textContent =
            stats.downloads || 0;
          document.getElementById("totalUsers").textContent = stats.users || 0;
        } catch (e) {}
      }

      function showAlert(msg, type) {
        const box = document.getElementById("alertBox");
        box.textContent = msg;
        box.className = "alert alert-" + type;
        setTimeout(() => {
          box.className = "alert";
        }, 5000);
      }

      function logout() {
        localStorage.clear();
        sessionStorage.clear();
        window.location.replace("/login");
      }

      loadStats();
    </script>
  </body>
</html>
