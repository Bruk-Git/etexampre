<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile - Ethiopian Exam Prep</title>
    <link rel="icon" href="images/logo.jpg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f0f4f8;
        color: #2c3e50;
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ===== NAVIGATION BAR ===== */
      .header {
        background: linear-gradient(135deg, #0a2540, #003b6f);
        padding: 12px 30px;
        position: fixed;
        width: 100%;
        top: 0;
        z-index: 1000;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        animation: slideDown 0.5s ease-out;
      }
      @keyframes slideDown {
        from {
          transform: translateY(-100%);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      .nav {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .logo-container {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
      }
      .logo-image {
        height: 45px;
        width: 45px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid rgba(77, 166, 255, 0.3);
        transition: all 0.3s ease;
      }
      .logo-image:hover {
        transform: scale(1.05);
        box-shadow: 0 0 20px rgba(77, 166, 255, 0.3);
        border-color: #4da6ff;
      }
      .logo {
        color: white;
        font-size: 20px;
        font-weight: 700;
        text-decoration: none;
      }
      .logo:hover {
        color: #4da6ff;
      }
      .nav-right {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .user-badge {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(255, 255, 255, 0.1);
        padding: 8px 16px;
        border-radius: 25px;
      }
      .user-avatar {
        width: 35px;
        height: 35px;
        border-radius: 50%;
        background: linear-gradient(135deg, #4da6ff, #66ccff);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 0.9rem;
      }
      .user-name {
        color: white;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .logout-btn {
        background: rgba(255, 82, 82, 0.9);
        color: white;
        border: none;
        padding: 10px 22px;
        border-radius: 25px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9rem;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .logout-btn:hover {
        background: #dc2626;
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(220, 38, 38, 0.4);
      }

      /* ===== MAIN CONTENT ===== */
      .main-content {
        flex: 1;
        margin-top: 70px;
        padding: 40px 20px;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }

      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 30px;
        color: #5a6c7d;
        font-size: 0.9rem;
        flex-wrap: wrap;
      }
      .breadcrumb a {
        color: #4da6ff;
        text-decoration: none;
      }
      .breadcrumb a:hover {
        text-decoration: underline;
      }
      .breadcrumb i {
        font-size: 0.7rem;
        color: #9ca3af;
      }

      .profile-header {
        text-align: center;
        margin-bottom: 35px;
      }
      .profile-avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: linear-gradient(135deg, #4da6ff, #66ccff);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 2.5rem;
        font-weight: 700;
        margin: 0 auto 15px;
        box-shadow: 0 10px 30px rgba(77, 166, 255, 0.3);
      }
      .profile-header h1 {
        font-size: 2rem;
        color: #003b6f;
        margin-bottom: 5px;
      }
      .profile-header p {
        color: #5a6c7d;
      }

      .alert {
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        display: none;
        font-weight: 500;
      }
      .alert-success {
        background: #d1fae5;
        color: #065f46;
        border: 1px solid #a7f3d0;
        display: block;
      }
      .alert-error {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fecaca;
        display: block;
      }

      .profile-card {
        background: white;
        border-radius: 20px;
        padding: 35px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
      }
      .profile-card h2 {
        font-size: 1.3rem;
        color: #003b6f;
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 2px solid #e6f0ff;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .profile-card h2 i {
        color: #4da6ff;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        color: #374151;
        font-size: 0.85rem;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        font-size: 0.95rem;
        transition: all 0.3s;
        background: #f9fafb;
        font-family: inherit;
      }
      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: #4da6ff;
        box-shadow: 0 0 0 3px rgba(77, 166, 255, 0.1);
        background: white;
      }
      .form-group input:disabled {
        background: #f3f4f6;
        color: #9ca3af;
        cursor: not-allowed;
      }

      .submit-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #4da6ff, #66ccff);
        color: white;
        border: none;
        border-radius: 25px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .submit-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(77, 166, 255, 0.4);
      }
      .submit-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .info-box {
        background: #e6f0ff;
        border-radius: 10px;
        padding: 15px 20px;
        margin-bottom: 25px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .info-box i {
        font-size: 1.5rem;
        color: #4da6ff;
      }
      .info-box p {
        color: #003b6f;
        font-size: 0.9rem;
      }

      .footer {
        background: linear-gradient(135deg, #0a2540, #003b6f);
        color: rgba(255, 255, 255, 0.7);
        text-align: center;
        padding: 25px;
      }
      .footer a {
        color: #4da6ff;
        text-decoration: none;
      }

      @media (max-width: 768px) {
        .header {
          padding: 10px 15px;
        }
        .logo {
          font-size: 16px;
        }
        .logo-image {
          height: 35px;
          width: 35px;
        }
        .user-name {
          display: none;
        }
        .form-row {
          grid-template-columns: 1fr;
        }
        .profile-card {
          padding: 25px 20px;
        }
        .profile-avatar {
          width: 80px;
          height: 80px;
          font-size: 2rem;
        }
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #e6f0ff;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(135deg, #4da6ff, #66ccff);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <nav class="nav">
        <a href="/dashboard" class="logo-container">
          <img src="images/logo.jpg" alt="Logo" class="logo-image" />
          <span class="logo">Ethiopian Exam Prep</span>
        </a>
        <div class="nav-right">
          <div class="user-badge">
            <div class="user-avatar" id="userAvatar">S</div>
            <span class="user-name" id="userName">Student</span>
          </div>
          <button class="logout-btn" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </nav>
    </header>

    <main class="main-content">
      <div class="container">
        <div class="breadcrumb">
          <a href="/dashboard">Dashboard</a>
          <i class="fas fa-chevron-right"></i>
          <span>My Profile</span>
        </div>

        <div class="profile-header">
          <div class="profile-avatar" id="profileAvatar">S</div>
          <h1 id="profileName">My Profile</h1>
          <p>Manage your account information</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <div class="profile-card">
          <h2><i class="fas fa-user"></i> Personal Information</h2>

          <div class="info-box">
            <i class="fas fa-info-circle"></i>
            <p>Update your information below. Email cannot be changed.</p>
          </div>

          <form id="profileForm" novalidate>
            <div class="form-row">
              <div class="form-group">
                <label>Full Name *</label>
                <input
                  type="text"
                  id="fullName"
                  placeholder="Your full name"
                  required
                />
              </div>
              <div class="form-group">
                <label>Email (Cannot change)</label>
                <input type="email" id="email" disabled />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" placeholder="09XX XXX XXXX" />
              </div>
              <div class="form-group">
                <label>Grade/Level</label>
                <select id="grade">
                  <option value="">Select your level</option>
                  <option value="6th Grade">6th Grade</option>
                  <option value="8th Grade">8th Grade</option>
                  <option value="12th Grade">12th Grade</option>
                  <option value="University Freshman">
                    University Freshman
                  </option>
                  <option value="University Senior">University Senior</option>
                  <option value="Graduate Student">Graduate Student</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label>School/University</label>
              <input
                type="text"
                id="institution"
                placeholder="Your school or university name"
              />
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
              <i class="fas fa-save"></i> Save Changes
            </button>
          </form>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>© 2026 <a href="/">Ethiopian Exam Prep</a> · Free for all students</p>
    </footer>

    <script>
      const token = localStorage.getItem("token");
      const user = JSON.parse(localStorage.getItem("user") || "{}");

      if (!token) {
        window.location.replace("/login");
      }

      const fullName = user.fullName || user.full_name || "Student";
      document.getElementById("userName").textContent = fullName;
      document.getElementById("userAvatar").textContent = fullName
        .charAt(0)
        .toUpperCase();
      document.getElementById("profileAvatar").textContent = fullName
        .charAt(0)
        .toUpperCase();
      document.getElementById("profileName").textContent = fullName;

      // ===== LOAD PROFILE DATA =====
      async function loadProfile() {
        try {
          const response = await fetch("/api/auth/profile", {
            headers: { Authorization: `Bearer ${token}` },
          });

          if (response.ok) {
            const data = await response.json();
            const profile = data.user;

            document.getElementById("fullName").value = profile.full_name || "";
            document.getElementById("email").value = profile.email || "";
            document.getElementById("phone").value = profile.phone || "";
            document.getElementById("grade").value = profile.grade || "";
            document.getElementById("institution").value =
              profile.institution || "";

            // Update display
            const name = profile.full_name || "Student";
            document.getElementById("userName").textContent = name;
            document.getElementById("userAvatar").textContent = name
              .charAt(0)
              .toUpperCase();
            document.getElementById("profileAvatar").textContent = name
              .charAt(0)
              .toUpperCase();
            document.getElementById("profileName").textContent = name;
          } else {
            showAlert("Failed to load profile. Please try again.", "error");
          }
        } catch (error) {
          console.error("Error loading profile:", error);
          showAlert("Connection error. Please try again.", "error");
        }
      }

      // ===== UPDATE PROFILE =====
      document
        .getElementById("profileForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const fullNameInput = document
            .getElementById("fullName")
            .value.trim();
          const phone = document.getElementById("phone").value.trim();
          const grade = document.getElementById("grade").value;
          const institution = document
            .getElementById("institution")
            .value.trim();
          const submitBtn = document.getElementById("submitBtn");

          // Validation
          if (!fullNameInput || fullNameInput.length < 2) {
            showAlert("Name must be at least 2 characters.", "error");
            return;
          }

          if (phone) {
            const cleanPhone = phone.replace(/\s+/g, "");
            if (!/^(\+251|0)[9]\d{8}$/.test(cleanPhone)) {
              showAlert(
                "Please enter a valid Ethiopian phone number.",
                "error",
              );
              return;
            }
          }

          submitBtn.disabled = true;
          submitBtn.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Saving...';

          try {
            const response = await fetch("/api/auth/profile", {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({
                fullName: fullNameInput,
                phone: phone || null,
                grade: grade || null,
                institution: institution || null,
              }),
            });

            const data = await response.json();

            if (response.ok) {
              // Update local storage
              const updatedUser = {
                ...user,
                fullName: fullNameInput,
                full_name: fullNameInput,
                phone: phone,
                grade: grade,
                institution: institution,
              };
              localStorage.setItem("user", JSON.stringify(updatedUser));

              // Update display
              document.getElementById("userName").textContent = fullNameInput;
              document.getElementById("userAvatar").textContent = fullNameInput
                .charAt(0)
                .toUpperCase();
              document.getElementById("profileAvatar").textContent =
                fullNameInput.charAt(0).toUpperCase();
              document.getElementById("profileName").textContent =
                fullNameInput;

              showAlert("✅ Profile updated successfully!", "success");
            } else {
              showAlert(
                data.error || "Update failed. Please try again.",
                "error",
              );
            }
          } catch (error) {
            console.error("Update error:", error);
            showAlert("Connection error. Please try again.", "error");
          } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-save"></i> Save Changes';
          }
        });

      function showAlert(msg, type) {
        const box = document.getElementById("alertBox");
        box.textContent = msg;
        box.className = "alert alert-" + type;
        setTimeout(() => {
          box.className = "alert";
          box.textContent = "";
        }, 5000);
      }

      function logout() {
        localStorage.clear();
        sessionStorage.clear();
        document.cookie.split(";").forEach((c) => {
          document.cookie = c
            .replace(/^ +/, "")
            .replace(
              /=.*/,
              "=;expires=" + new Date().toUTCString() + ";path=/",
            );
        });
        window.location.replace("/login");
      }

      window.addEventListener("pageshow", function (e) {
        if (e.persisted && !localStorage.getItem("token")) {
          window.location.replace("/login");
        }
      });

      loadProfile();
    </script>
  </body>
</html>
